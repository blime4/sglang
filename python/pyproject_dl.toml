[build-system]
# DL begin
# DLIN (DLIN) variant: no Rust grpc ext, no NVIDIA-only binary deps
# (flashinfer / flash-attn-4 / nvidia-cutlass-dsl / cuda-python are not on the
# DLIN index). sgl-kernel is built from source (sgl-kernel/) with dlcc and is
# NOT pinned here so `pip install -e` does not try to pull an NVIDIA wheel.
# Mirrors the pyproject_other.toml / pyproject_npu.toml platform pattern.
# DL end
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang"
dynamic = ["version"]
description = "SGLang is a fast serving framework for large language models and vision language models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
# Please keep dependency lists in this file sorted alphabetically by package name.
dependencies = ["aiohttp", "IPython", "numpy", "requests", "setproctitle", "tqdm"]

[project.optional-dependencies]
runtime_common = [
  "aiohttp",
  "anthropic>=0.20.0",
  "apache-tvm-ffi==0.1.12",  # DL: pin to the version the dlcc patch (scripts/dl/tvm_ffi_cpp_extension_dl.patch) is cut against. Bump together with the patch + the dl_patch_tvm_ffi version guard.
  "av ; platform_machine != 'loongarch64'",  # DL: no loong wheel + ffmpeg-devel unavailable on loong CI → exclude (video/multimedia not exercised by loong smoke gate)
  "blobfile==3.0.0",
  "build",
  "compressed-tensors",
  "datasets",
  "easydict",
  "einops",
  "fastapi",
  "gguf",
  "interegular",
  "IPython",
  "llguidance>=0.7.11,<0.8.0",
  "mistral_common>=1.11.0",
  "modelscope",
  "msgspec",
  "ninja",
  "numpy",
  "openai==2.6.1",
  "openai-harmony==0.0.4",
  "orjson",
  "outlines==0.1.11",
  "packaging",
  "partial_json_parser",
  "pillow",
  "prometheus-client>=0.20.0",
  "psutil",
  "py-spy",
  "pybase64",
  "pydantic",
  "python-multipart",
  "pyzmq>=25.1.2",
  "requests",
  "scipy",
  "sentencepiece",
  "setproctitle",
  "smg-grpc-servicer>=0.5.0",
  "soundfile==0.13.1",
  "tiktoken",
  "timm==1.0.16",
  "torchao==0.9.0",
  "tqdm",
  "transformers==5.8.1",
  "uvicorn",
  "uvloop",
  "xgrammar==0.2.1",
]

# DLIN (DLIN) runtime. torch is the DLIN-patched wheel exposing
# torch.version.dl (installed via the dl-virtual index, see run_sglang.sh).
# triton 3.3.0+dlgpu: DLIN-specific build with dlgpu backend that compiles
# @triton.jit kernels to dlgput64 format. Installed from sw-triton artifactory
# (see run_sglang.sh phase_setup). The >= allows both git4b604310 and git0f83b16e.
# sgl-kernel is built from source separately with dlcc; if absent, sglang
# degrades to torch fallbacks (import sgl_kernel is wrapped in try/except).
# DL begin
srt_dl = [
  "sglang[runtime_common]",
  "torch==2.9.1+dl24.sdk202606031721",
  "triton>=3.3.0",
  "flash-attn==2.8.4+torch291.sdk202606031721",  # DLIN Flash Attention (FA2)
]
# DL end

diffusion_common = [
  "addict",
  "cloudpickle",
  "diffusers==0.37.0",
  "imageio==2.36.0",
  "imageio-ffmpeg==0.5.1",
  "moviepy>=2.0.0",
  "opencv-python-headless==4.10.0.84",
  "PyYAML==6.0.1",
  "remote-pdb",
  "scikit-image==0.25.2",
  "trimesh>=4.0.0",
  "xatlas",
]

diffusion_dl = [
  "cache-dit==1.3.0",
  "peft>=0.18.0,<0.19.0",
  "runai_model_streamer>=0.15.5",
  "sglang[diffusion_common]",
  "st_attn==0.0.7",
  "vsa==0.0.4",
]

tracing = [
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-exporter-otlp-proto-grpc",
  "opentelemetry-sdk",
]

test = [
  "accelerate",
  "expecttest",
  "gguf",
  "jsonlines",
  "matplotlib",
  "pandas",
  "peft>=0.18.0,<0.19.0",
  "pytest",
  "sentence_transformers",
  "tabulate",
]

all_dl = ["sglang[diffusion_dl]", "sglang[srt_dl]", "sglang[tracing]"]
dev_dl = ["sglang[all_dl]", "sglang[test]"]

[project.urls]
"Homepage" = "https://github.com/sgl-project/sglang"
"Bug Tracker" = "https://github.com/sgl-project/sglang/issues"

[project.scripts]
sglang = "sglang.cli.main:main"

[tool.setuptools.package-data]
"sglang" = [
  "srt/**/*",
  "jit_kernel/**/*"
]

[tool.setuptools.packages.find]
exclude = [
  "assets*",
  "benchmark*",
  "docs*",
  "dist*",
  "playground*",
  "scripts*",
  "tests*",
]

[tool.wheel]
exclude = [
  "assets*",
  "benchmark*",
  "docs*",
  "dist*",
  "playground*",
  "scripts*",
  "tests*",
]

[tool.setuptools_scm]
root = ".."
version_file = "sglang/_version.py"
git_describe_command = ["python3", "python/tools/get_version_tag.py"]
# Allow editable installs even when .git metadata is not available.
fallback_version = "0.0.0.dev0"
