workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never

variables:
  SDK_TAG: V2_SOFTWARE_master_202607101443  # Unified SDK version supporting multiple architectures
  SDK_TYPE: test  # Use test SDK type (extract only, no installation required)
  GIT_SUBMODULE_STRATEGY: recursive # Enable recursive submodule cloning strategy
  GIT_DEPTH: "0"             # Full clone so setuptools-scm resolves the real version from tags (avoids 0.0.0.dev fallback + build/smoke name mismatch)
  GIT_FETCH_TAGS: "true"     # Fetch tags for setuptools-scm version computation
  PAGES_BRANCH: "gh-pages"
  # SDK workspace path structure
  # Add CI_RUNNER_SHORT_TOKEN and CI_CONCURRENT_ID to isolate SDK per runner and concurrent job
  SDK_STORE_ROOT: "${CI_BUILDS_DIR}/${CI_RUNNER_SHORT_TOKEN}/${CI_PROJECT_PATH_SLUG}/sdk_store/${CI_CONCURRENT_ID}"
  SDK_WORKSPACE: "${SDK_STORE_ROOT}/${SDK_TAG}"
  CCACHE_DIR: "${CI_BUILDS_DIR}/${CI_RUNNER_SHORT_TOKEN}/CCACHE"
  UV_CACHE_DIR: "${CI_BUILDS_DIR}/${CI_RUNNER_SHORT_TOKEN}/UV_CACHE"
  UV_HTTP_TIMEOUT: "500"
  SDK_PATH: "${SDK_WORKSPACE}/sdk"
  export_sglang_whl_path: "${SDK_WORKSPACE}/sdk"
  # JFrog repository for sglang wheel upload (dl-pypi/<pkg>/)
  JFROG_SGLANG_REPO: "dl-pypi"

stages:
  - compile_test_sglang
  - bundle
  - deploy

compile_test_sglang:
  stage: compile_test_sglang
  tags:
    - build-x86_64
  rules:
    - when: on_success
  script:
    - bash .dlci/devops-scripts/tools/check-forbidden-words.sh
    # Environment check using devops-scripts common script
    # (includes x86_64 container cleanup pre-check: dlsmi -r → docker stop → kill → restart)
    - bash .dlci/devops-scripts/linux/check-env.sh
    # SDK preparation using devops-scripts common script
    - bash .dlci/devops-scripts/common/prepare-sdk.sh
    # Pre-download triton wheel to SDK_PATH (outside Docker where JFrog CLI is configured)
    - bash -c 'source scripts/run/triton_utils.sh && ensure_triton_from_sdk_tag download "${SDK_PATH}" "$(uname -m)" "${SDK_TAG}"'
    # GitLab automatically clones repository, display current branch and recent commits
    - "git branch && git log --oneline -n 5"
    - export REPO_PATH="$CI_PROJECT_DIR"
    - export SGLANG_USE_LOCAL_MODEL_PATH=/mars/aebox/LLM/model
    - "echo Starting sglang compilation at: $(pwd)"
    - "cd ${REPO_PATH}/scripts/commands/build && bash run_build.sh"
    - "echo Starting tests at: $(pwd)"
    - "cd ${REPO_PATH}/scripts/commands/unittests && bash run_smoke.sh"
  after_script:
    - echo "Adjusting permissions for CI_PROJECT_DIR parent directory..."
    - sudo chown -R $(id -u):$(id -g) $(dirname $CI_PROJECT_DIR)
    - echo "Cleaning old wheel packages (keeping only files from last 24 hours)..."
    - find ${export_sglang_whl_path} -name "sglang*.whl" -mtime +1 -delete 2>/dev/null || true
    - echo "Processing wheel package..."
    # Use quotes to prevent shell wildcard expansion, let process_whl.sh handle it
    - bash ${CI_PROJECT_DIR}/.dlci/process_whl.sh --verbose --output-dir ${CI_PROJECT_DIR}/processed_wheels/${CI_PIPELINE_ID} --sdk-tag ${SDK_TAG} "${export_sglang_whl_path}/sglang-*.whl"
    # Use command substitution directly instead of temporary file to avoid permission issues
    - export PROCESSED_WHL=$(find ${CI_PROJECT_DIR}/processed_wheels/${CI_PIPELINE_ID} -name "sglang-*.whl" | head -1)
    - echo "Found processed wheel:" && echo "$PROCESSED_WHL"
    - echo "Uploading wheel package:"
    - bash ${CI_PROJECT_DIR}/.dlci/upload_to_jfrog.sh --verbose "$PROCESSED_WHL"
  artifacts:
    when: always
    paths:
      - processed_wheels/${CI_PIPELINE_ID}/sglang-*.whl
      - scripts/run/docker_sglang_build_None.log
      - scripts/run/docker_sglang_unittests_smoke_unittests.log
    expire_in: 7 days

compile_test_sglang_aarch64:
  stage: compile_test_sglang
  tags:
