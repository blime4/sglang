<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" text-rendering="geometricPrecision" font-family="'Noto Sans CJK SC', system-ui, sans-serif">
  <title>图 1 — Qwen3.5-35B-A3B-FP8 混合架构</title>
  <desc>40 层混合模型示意:30 层 GatedDeltaNet(线性注意力)+ 10 层全注意力,均后接共享 FP8 MoE 模块,每个模块都映射到一个 DLIN 算子。</desc>
  <style>
    .r { color-scheme: light;
      --surface:#fcfcfb; --card:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
      --grid:#e1e0d9; --base:#c3c2b7; --ring:rgba(11,11,11,0.12);
      --blue:#2a78d6; --green:#008300; --orange:#eb6834; }
    @media (prefers-color-scheme: dark) {
      .r { color-scheme: dark;
        --surface:#1a1a19; --card:#20201e; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
        --grid:#2c2c2a; --base:#383835; --ring:rgba(255,255,255,0.14);
        --blue:#3987e5; --green:#2fae2f; --orange:#d95926; } }
    .r .sf { fill: var(--surface); }
    .r text { fill: var(--ink); }
    .r .i2 { fill: var(--ink2); }
    .r .mu { fill: var(--muted); }
  </style>

  <g class="r">
    <rect class="sf" width="900" height="560"/>

    <text x="40" y="42" font-size="21" font-weight="700">图 1 · Qwen3.5-35B-A3B-FP8 混合架构</text>
    <text x="40" y="66" font-size="13" class="i2">40 个 transformer 层:30 个 GatedDeltaNet(线性注意力)+ 10 个全注意力,每层后接 FP8 MoE 模块</text>

    <!-- 全注意力 card -->
    <g>
      <rect x="60" y="100" width="350" height="300" rx="10" fill="var(--card)" stroke="var(--ring)"/>
      <rect x="60" y="100" width="350" height="40" rx="10" fill="var(--blue)" fill-opacity="0.14"/>
      <rect x="60" y="130" width="350" height="10" fill="var(--blue)" fill-opacity="0.14"/>
      <circle cx="84" cy="120" r="5" fill="var(--blue)"/>
      <text x="98" y="125" font-size="15" font-weight="700">全注意力层</text>
      <text x="250" y="125" font-size="15" font-weight="700" class="i2">× 10</text>
      <g font-size="13">
        <rect x="86" y="162" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="100" y="187">QKVO 投影 · FP8 GEMM</text>
        <rect x="86" y="214" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="100" y="239">分页注意力 · FA3 decode</text>
        <rect x="86" y="266" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="100" y="291">RMSNorm + 残差</text>
      </g>
      <text x="86" y="334" font-size="11" class="mu">基于分页 KV cache 的标准因果多头注意力。</text>
      <text x="86" y="352" font-size="11" class="mu">DLIN 算子:自编 FA2 / sgl-kernel paged_decode_attn。</text>
    </g>

    <!-- GDN card -->
    <g>
      <rect x="490" y="100" width="350" height="300" rx="10" fill="var(--card)" stroke="var(--ring)"/>
      <rect x="490" y="100" width="350" height="40" rx="10" fill="var(--green)" fill-opacity="0.16"/>
      <rect x="490" y="130" width="350" height="10" fill="var(--green)" fill-opacity="0.16"/>
      <circle cx="514" cy="120" r="5" fill="var(--green)"/>
      <text x="528" y="125" font-size="15" font-weight="700">GatedDeltaNet 层</text>
      <text x="700" y="125" font-size="15" font-weight="700" class="i2">× 30</text>
      <g font-size="13">
        <rect x="516" y="162" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="530" y="187">QKVO 投影 · FP8 GEMM</text>
        <rect x="516" y="214" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="530" y="239">因果 conv1d + 门控</text>
        <rect x="516" y="266" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="530" y="291">循环状态更新</text>
      </g>
      <text x="516" y="334" font-size="11" class="mu">线性(状态空间)注意力——每层带一个</text>
      <text x="516" y="352" font-size="11" class="mu">循环隐状态。DLIN 算子:_dl_C.dl_recurrent_gated_delta_rule。</text>
    </g>

    <!-- 汇聚箭头 -->
    <g stroke="var(--base)" stroke-width="1.5" fill="none">
      <path d="M235 400 L 235 430 L 450 430 L 450 452" />
      <path d="M665 400 L 665 430 L 450 430" />
      <path d="M450 452 l -5 -9 l 10 0 z" fill="var(--base)" stroke="none"/>
    </g>

    <!-- MoE block -->
    <g>
      <rect x="60" y="455" width="780" height="62" rx="10" fill="var(--orange)" fill-opacity="0.14" stroke="var(--orange)" stroke-opacity="0.5"/>
      <circle cx="86" cy="486" r="5" fill="var(--orange)"/>
      <text x="100" y="481" font-size="15" font-weight="700">MoE 模块——每层都有</text>
      <text x="100" y="503" font-size="12.5" class="i2">路由 → 256 选 8 expert(FP8 分组 GEMM)→ combine + shared expert · blockwise [128,128]</text>
    </g>

    <text x="40" y="544" font-size="11.5" class="mu">上述每个模块都需要对应的 DLIN 算子存在且足够快——来自 SDK、DLEOL JIT 或 dlcc 编译的 kernel。全程 FP8 blockwise 权重。</text>
  </g>
</svg>
