<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" text-rendering="geometricPrecision" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Figure 1 — Qwen3.5-35B-A3B-FP8 hybrid architecture</title>
  <desc>Schematic of the 40-layer hybrid model: 30 GatedDeltaNet (linear attention) layers and 10 full-attention layers, each feeding a shared FP8 MoE block. Every block maps to a DLIN operator.</desc>
  <style>
    .r { color-scheme: light;
      --surface:#fcfcfb; --plane:#f6f5f2; --card:#ffffff;
      --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
      --grid:#e1e0d9; --base:#c3c2b7; --ring:rgba(11,11,11,0.12);
      --blue:#2a78d6; --green:#008300; --orange:#eb6834; }
    @media (prefers-color-scheme: dark) {
      .r { color-scheme: dark;
        --surface:#1a1a19; --plane:#161614; --card:#20201e;
        --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
        --grid:#2c2c2a; --base:#383835; --ring:rgba(255,255,255,0.14);
        --blue:#3987e5; --green:#2fae2f; --orange:#d95926; } }
    .r .sf { fill: var(--surface); }
    .r text { fill: var(--ink); }
    .r .i2 { fill: var(--ink2); }
    .r .mu { fill: var(--muted); }
  </style>

  <g class="r">
    <rect class="sf" width="900" height="560"/>

    <!-- Title -->
    <text x="40" y="42" font-size="21" font-weight="700">Figure 1 · Qwen3.5-35B-A3B-FP8 — a hybrid architecture</text>
    <text x="40" y="66" font-size="13" class="i2">40 transformer layers: 30 GatedDeltaNet (linear attention) + 10 full attention — each followed by an FP8 MoE block</text>

    <!-- Full-attention card -->
    <g>
      <rect x="60" y="100" width="350" height="300" rx="10" fill="var(--card)" stroke="var(--ring)"/>
      <rect x="60" y="100" width="350" height="40" rx="10" fill="var(--blue)" fill-opacity="0.14"/>
      <rect x="60" y="130" width="350" height="10" fill="var(--blue)" fill-opacity="0.14"/>
      <circle cx="84" cy="120" r="5" fill="var(--blue)"/>
      <text x="98" y="125" font-size="15" font-weight="700">Full-attention layer</text>
      <text x="98" y="125" font-size="15" font-weight="700" class="i2" dx="172">× 10</text>

      <!-- inner blocks -->
      <g font-size="13">
        <rect x="86" y="162" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="100" y="187">QKVO projection · FP8 GEMM</text>
        <rect x="86" y="214" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="100" y="239">Paged attention · FA3 decode</text>
        <rect x="86" y="266" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="100" y="291">RMSNorm + residual add</text>
      </g>
      <text x="86" y="334" font-size="11" class="mu">Standard causal multi-head attention over a paged KV cache.</text>
      <text x="86" y="352" font-size="11" class="mu">DLIN kernel: hand-built FA2 binary / sgl-kernel paged_decode_attn.</text>
    </g>

    <!-- GDN card -->
    <g>
      <rect x="490" y="100" width="350" height="300" rx="10" fill="var(--card)" stroke="var(--ring)"/>
      <rect x="490" y="100" width="350" height="40" rx="10" fill="var(--green)" fill-opacity="0.16"/>
      <rect x="490" y="130" width="350" height="10" fill="var(--green)" fill-opacity="0.16"/>
      <circle cx="514" cy="120" r="5" fill="var(--green)"/>
      <text x="528" y="125" font-size="15" font-weight="700">GatedDeltaNet layer</text>
      <text x="528" y="125" font-size="15" font-weight="700" class="i2" dx="186">× 30</text>

      <g font-size="13">
        <rect x="516" y="162" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="530" y="187">QKVO projection · FP8 GEMM</text>
        <rect x="516" y="214" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="530" y="239">causal conv1d + gating</text>
        <rect x="516" y="266" width="298" height="40" rx="6" fill="var(--surface)" stroke="var(--grid)"/>
        <text x="530" y="291">recurrent state update</text>
      </g>
      <text x="516" y="334" font-size="11" class="mu">Linear (state-space) attention — a recurrent hidden state</text>
      <text x="516" y="352" font-size="11" class="mu">per layer. DLIN kernel: _dl_C.dl_recurrent_gated_delta_rule.</text>
    </g>

    <!-- Convergence arrows to MoE -->
    <g stroke="var(--base)" stroke-width="1.5" fill="none">
      <path d="M235 400 L 235 430 L 450 430 L 450 452" />
      <path d="M665 400 L 665 430 L 450 430" />
      <path d="M450 452 l -5 -9 l 10 0 z" fill="var(--base)" stroke="none"/>
    </g>

    <!-- MoE block -->
    <g>
      <rect x="60" y="455" width="780" height="62" rx="10" fill="var(--orange)" fill-opacity="0.14" stroke="var(--orange)" stroke-opacity="0.5"/>
      <circle cx="86" cy="486" r="5" fill="var(--orange)"/>
      <text x="100" y="481" font-size="15" font-weight="700">MoE block — every layer</text>
      <text x="100" y="503" font-size="12.5" class="i2">route → 8 of 256 experts (FP8 grouped GEMM) → combine + shared expert · blockwise [128,128]</text>
    </g>

    <!-- bottom note -->
    <text x="40" y="544" font-size="11.5" class="mu">Every block above requires a DLIN operator to exist and be fast — sourced from the SDK, DLEOL-JIT, or dlcc-compiled kernels. FP8 blockwise weights throughout.</text>
  </g>
</svg>
